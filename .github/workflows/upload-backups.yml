name: Upload backups to S3 (scheduled)

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Optional identifier for this run'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * 0' # weekly at 04:00 UTC

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo 'Missing AWS_ACCESS_KEY_ID secret' && exit 1; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then echo 'Missing AWS_SECRET_ACCESS_KEY secret' && exit 1; fi
          if [ -z "${{ secrets.BACKUPS_S3_BUCKET }}" ]; then echo 'Missing BACKUPS_S3_BUCKET secret' && exit 1; fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Install awscli
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Upload backups directory to S3 (AES256 SSE)
        env:
          BUCKET: ${{ secrets.BACKUPS_S3_BUCKET }}
          PREFIX: ${{ github.run_id }}
        run: |
          echo "Uploading ./backups to s3://$BUCKET/backups/$PREFIX/"
          aws s3 cp ./backups "s3://$BUCKET/backups/$PREFIX/" --recursive --sse AES256

      - name: Verify upload (list objects)
        env:
          BUCKET: ${{ secrets.BACKUPS_S3_BUCKET }}
          PREFIX: ${{ github.run_id }}
        run: |
          echo "Objects uploaded to s3://$BUCKET/backups/$PREFIX/"
          aws s3 ls "s3://$BUCKET/backups/$PREFIX/" --recursive

      - name: Post-run note
        run: |
          echo "Upload complete. Please rotate the AWS credentials used by this workflow if they are temporary or shared."
