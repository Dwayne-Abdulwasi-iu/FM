name: Send Day 7 Teaser Email Campaign

# Run on March 8 at 9 AM UTC (adjust timezone as needed)
on:
  schedule:
    - cron: '0 9 8 3 *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  send-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Send Day 7 Campaign
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://fashionmarketplace.store/api/cron/coming-soon-day7

      - name: Log Campaign Result
        run: echo "Day 7 campaign triggered successfully"
