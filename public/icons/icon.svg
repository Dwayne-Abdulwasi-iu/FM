<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#4f46e5"/>
  
  <!-- 4-pointed star (centered and scaled for larger icon) -->
  <path d="M256 64 L320 208 L464 256 L320 304 L256 448 L192 304 L48 256 L192 208 Z" fill="white" stroke="white" stroke-width="8"/>
  
  <!-- Hollow center circle -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="white" stroke-width="16"/>
  
  <!-- Small plus signs for sparkle effect -->
  <!-- Upper left plus -->
  <g stroke="white" stroke-width="20" stroke-linecap="round">
    <line x1="112" y1="96" x2="112" y2="160"/>
    <line x1="80" y1="128" x2="144" y2="128"/>
  </g>
  
  <!-- Lower right plus -->
  <g stroke="white" stroke-width="20" stroke-linecap="round">
    <line x1="400" y1="352" x2="400" y2="416"/>
    <line x1="368" y1="384" x2="432" y2="384"/>
  </g>
</svg>
