<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Código para restablecer contraseña</title>
    <style>
      :root { --bg: #f9fafb; --card: #ffffff; --text: #111827; --muted: #6b7280; --accent: #6366f1 }
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color: var(--text); background: var(--bg); margin:0 }
      .container { max-width:600px; margin:0 auto; padding:24px }
      .card { background: var(--card); border-radius: 8px; padding: 24px; box-shadow: 0 6px 18px rgba(16,24,40,0.08) }
      .code { font-size: 28px; font-weight: 700; letter-spacing: 4px; background:#f3f4f6; padding:12px 16px; display:inline-block; border-radius:6px }
      .footer { font-size: 13px; color: var(--muted); margin-top:16px }
      .brand { font-weight:700; color:var(--accent); margin-bottom:8px }
      .title { margin: 0 0 8px 0 }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="brand">{{appName}}</div>
        <h1 class="title">Código para restablecer contraseña</h1>
        <p>Utiliza el código a continuación para restablecer tu contraseña. Expira en 10 minutos.</p>
        <p class="code">{{code}}</p>
        <p class="footer">Si no solicitaste esto, puedes ignorar este correo. ¿Necesitas ayuda? Visita <a href="{{supportUrl}}">soporte</a> o escribe a <a href="mailto:{{supportEmail}}">{{supportEmail}}</a>.</p>
      </div>
    </div>
  </body>
</html>
